<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forms Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="form-title">Loading form…</h1>
    <p class="hint">Stands in for the AEM-rendered Form UI. The form structure comes from <code>GET /config</code>.</p>
    <p class="hint">To test failures: put <code>#fail-salesforce</code> (always fails) or <code>#flaky-salesforce</code> (fails twice, then succeeds) in the message, or attach a file whose name contains <code>eicar</code>.</p>

    <form id="form" novalidate hidden>
      <div id="fields"></div>
      <div class="actions">
        <button type="submit">Submit</button>
        <button type="button" id="clear-draft" class="secondary">Clear draft</button>
      </div>
      <p id="form-error" class="error" role="alert"></p>
    </form>

    <section id="result" hidden>
      <h2>Submission received</h2>
      <p>ID: <code id="submission-id"></code></p>
      <p>Status: <strong id="status"></strong></p>
      <ol id="history"></ol>
      <button type="button" id="new-submission" class="secondary">New submission</button>
    </section>
  </main>
  <script src="form.js"></script>
</body>
</html>
